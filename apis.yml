name: Xairos
description: Xairos Systems is a Techstars-backed company building quantum time transfer
  (QTT) technology - a space-based, quantum-resilient global timing and synchronization
  system positioned as a secure alternative to GPS for positioning, navigation, and
  timing (PNT). The company targets sub-nanosecond accuracy while mitigating GPS
  jamming and spoofing, serving critical infrastructure sectors such as transportation,
  finance, data centers, and power grids. Xairos publishes no first-party developer
  API, but its site ships an llms.txt and a live Wix Site MCP endpoint for agentic
  access to public site content.
